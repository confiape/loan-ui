# ================================================================
# Configuración de SonarQube para proyecto Angular 20 + Vitest
# ================================================================

# --- Información del proyecto ---
sonar.projectKey=loan-ui
sonar.projectName=loan-ui
sonar.projectVersion=1.0.0

# --- Configuración del servidor ---
sonar.host.url=http://localhost:9000
# sonar.token=<tu-token-aqui>  # Descomenta al usar CI/CD

# --- Rutas del código fuente ---
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Excluir archivos que no deben analizarse (idéntico a Vitest)
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/.angular/**,**/out-tsc/**,**/*.spec.ts,**/*.stories.ts,**/*.stories.tsx,**/*.config.ts,**/environments/**,.storybook/**,vitest.config.ts,eslint.config.js

# --- Rutas de test ---
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

# --- Cobertura ---
# Vitest genera lcov.info en "coverage/lcov.info"
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Excluir archivos sin sentido de cobertura (como main, modules, config)
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.config.ts,**/main.ts,**/environments/**,**/*.module.ts,.storybook/**

# --- Configuración adicional ---
sonar.typescript.node=node_modules/@types
sonar.log.level=INFO
