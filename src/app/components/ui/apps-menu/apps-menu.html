<div class="apps-menu-container">
  <!-- Apps Button -->
  <button
    type="button"
    class="apps-menu-button"
    [class.apps-menu-button-open]="isOpen()"
    (click)="toggle()"
    aria-label="View apps"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
  >
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
    </svg>
  </button>

  <!-- Dropdown -->
  @if (isOpen()) {
    <div class="apps-menu-dropdown" role="menu" [attr.aria-label]="title()">
      <div class="apps-menu-header">
        <span class="apps-menu-title">{{ title() }}</span>
      </div>
      <div class="apps-menu-grid">
        @for (app of apps(); track app.id) {
          <a
            [href]="app.href || '#'"
            class="apps-menu-item"
            (click)="onAppClick(app, $event)"
            role="menuitem"
            [attr.aria-label]="app.label"
          >
            <div class="apps-menu-item-icon" [innerHTML]="app.icon"></div>
            <div class="apps-menu-item-label">{{ app.label }}</div>
          </a>
        }
      </div>
    </div>
  }
</div>
