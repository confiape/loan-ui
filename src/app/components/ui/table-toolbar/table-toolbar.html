<div class="table-toolbar">
  <!-- Search Section -->
  @if (showSearch()) {
    <div class="table-toolbar-search">
      <form class="search-form" (submit)="$event.preventDefault()">
        <label [for]="'search-' + searchPlaceholder()" class="sr-only">{{
          searchPlaceholder()
        }}</label>
        <div class="search-input-wrapper">
          <div class="search-icon">
            <svg
              aria-hidden="true"
              class="icon"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill-rule="evenodd"
                d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                clip-rule="evenodd"
              />
            </svg>
          </div>
          <input
            type="text"
            [id]="'search-' + searchPlaceholder()"
            class="search-input"
            [placeholder]="searchPlaceholder()"
            (input)="onSearchInput($event)"
          />
        </div>
      </form>
    </div>
  }

  <!-- Actions Section -->
  @if (showActions()) {
    <div class="table-toolbar-actions">
      <!-- Primary Action Button -->
      @if (primaryAction(); as action) {
        <button
          type="button"
          class="btn-primary-action"
          [class.btn-primary]="action.variant === 'primary' || !action.variant"
          [class.btn-secondary]="action.variant === 'secondary'"
          [class.btn-outline]="action.variant === 'outline'"
          (click)="onPrimaryActionClick()"
        >
          @if (action.icon) {
            <svg
              class="icon-btn"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <path
                clip-rule="evenodd"
                fill-rule="evenodd"
                d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
              />
            </svg>
          }
          {{ action.label }}
        </button>
      }

      <!-- Bulk Actions -->
      @if (bulkActions().length > 0) {
        @for (action of bulkActions(); track action.label) {
          <button type="button" class="btn-action" (click)="onBulkActionClick(action)">
            {{ action.label }}
          </button>
        }
      }
    </div>
  }
</div>
