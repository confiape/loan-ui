<nav class="h-16 flex items-center px-4 lg:px-6" role="navigation" aria-label="Main navigation">
  <div class="flex items-center justify-between w-full max-w-full">
    <!-- Left Section: Menu + Title -->
    <div class="flex items-center gap-3 min-w-0">
      <!-- Menu Toggle Button -->
      <button
        class="inline-flex items-center justify-center p-2 rounded-md text-[var(--color-text-secondary)] hover:bg-[var(--color-bg-secondary)] hover:text-[var(--color-text-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--color-primary)] focus:ring-offset-2 transition-all duration-150 lg:hidden"
        (click)="onMenuToggle()"
        aria-label="Toggle menu"
        type="button"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          ></path>
        </svg>
      </button>

      <!-- Title -->
      <span
        class="text-lg lg:text-xl font-semibold text-[var(--color-text-primary)] whitespace-nowrap overflow-hidden text-ellipsis">
        {{ appTitle() }}
      </span>
    </div>

    <!-- Right Section (empty for now) -->
    <div class="flex items-center gap-2 ml-auto"></div>
  </div>
</nav>
