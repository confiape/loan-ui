<div
  class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-primary to-secondary"
>
  <div class="w-full max-w-md bg-white dark:bg-gray-800 rounded-lg shadow-2xl p-8">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900 dark:text-white mb-2">Bienvenido</h1>
      <p class="text-base text-gray-600 dark:text-gray-400">Inicia sesión en tu cuenta</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <!-- Email Field -->
      <div class="flex flex-col gap-2">
        <label for="email" class="text-sm font-medium text-gray-900 dark:text-white">Email</label>
        <input
          id="email"
          data-testid="login-email-input"
          type="email"
          class="w-full px-3 py-2 border border-gray-300 dark:border-gray-600 rounded-md text-base text-gray-900 dark:text-white bg-gray-50 dark:bg-gray-700 transition-colors duration-150 ease-in-out focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:opacity-60 disabled:cursor-not-allowed placeholder:text-gray-400 dark:placeholder:text-gray-500"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="tu@email.com"
          required
          [disabled]="isLoading()"
        />
      </div>

      <!-- Password Field -->
      <div class="flex flex-col gap-2">
        <label for="password" class="text-sm font-medium text-gray-900 dark:text-white"
          >Contraseña</label
        >
        <div class="relative flex items-center">
          <input
            id="password"
            data-testid="login-password-input"
            [type]="showPassword() ? 'text' : 'password'"
            class="w-full px-3 py-2 pr-12 border border-gray-300 dark:border-gray-600 rounded-md text-base text-gray-900 dark:text-white bg-gray-50 dark:bg-gray-700 transition-colors duration-150 ease-in-out focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 disabled:opacity-60 disabled:cursor-not-allowed placeholder:text-gray-400 dark:placeholder:text-gray-500"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
            placeholder="••••••••"
            required
            [disabled]="isLoading()"
          />
          <button
            type="button"
            class="absolute right-2 bg-transparent border-0 cursor-pointer p-2 text-lg text-gray-600 dark:text-gray-400 transition-colors duration-150 ease-in-out hover:text-primary disabled:opacity-50 disabled:cursor-not-allowed"
            (click)="togglePasswordVisibility()"
            [disabled]="isLoading()"
          >
            @if (showPassword()) {
              <span>👁️</span>
            } @else {
              <span>👁️‍🗨️</span>
            }
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        data-testid="login-submit-button"
        class="btn btn-primary btn-lg w-full mt-2 flex items-center justify-center gap-2"
        [disabled]="isLoading() || !email() || !password()"
      >
        @if (isLoading()) {
          <span
            class="inline-block w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"
          ></span>
          <span>Iniciando sesión...</span>
        } @else {
          <span>Iniciar Sesión</span>
        }
      </button>
    </form>

    <!-- Footer -->
    <div class="mt-6 pt-6 border-t border-gray-200 dark:border-gray-700 text-center">
      <p class="text-sm text-gray-600 dark:text-gray-400 m-0">
        ¿Olvidaste tu contraseña?
        <a
          href="#"
          class="text-primary no-underline font-medium transition-colors duration-150 ease-in-out hover:text-primary-dark hover:underline"
          >Recuperar</a
        >
      </p>
    </div>
  </div>
</div>
