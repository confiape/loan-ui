<div class="p-6">
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Roles</h1>
    <p class="text-sm text-[var(--color-text-secondary)] mt-1">
      Manage user roles and permissions
    </p>
  </div>

  <div class="mb-4">
    <app-table-toolbar
      searchPlaceholder="Search roles..."
      [primaryAction]="primaryAction"
      [bulkActions]="hasSelection() ? bulkActions : []"
      (searchChange)="searchTerm.set($event)"
      (bulkActionClick)="showDeleteConfirm.set(true)"
    />
  </div>

  <div class="bg-white rounded-lg shadow-sm border border-[var(--color-border)]">
    <app-table
      [columns]="columns"
      [data]="tableData"
      [rowActions]="rowActions"
      [selectable]="true"
      [selectedItems]="selectedRoles()"
      [loading]="loading()"
      (selectionChange)="selectedRoles.set($event)"
    />

    @if (filteredRoles().length > 0) {
    <div class="border-t border-[var(--color-border)]">
      <app-table-pagination
        [currentPage]="currentPage()"
        [pageSize]="pageSize()"
        [totalItems]="filteredRoles().length"
        (pageChange)="onPageChange($event)"
      />
    </div>
    }
  </div>

  <!-- Form Modal -->
  <app-modal
    [isOpen]="showModal()"
    [title]="editingRole() ? 'Edit Role' : 'New Role'"
    size="lg"
    (closed)="onFormCancel()"
  >
    <app-roles-form
      [role]="editingRole()"
      [allPermissions]="allPermissions()"
      [allRoles]="allRoles()"
      (saveRole)="onFormSave()"
      (cancelForm)="onFormCancel()"
    />
  </app-modal>

  <!-- Delete Confirmation Modal -->
  <app-modal
    [isOpen]="showDeleteConfirm()"
    title="Delete Role"
    size="sm"
    (closed)="showDeleteConfirm.set(false)"
  >
    <div class="p-4">
      <p [innerHTML]="deleteMessage" class="text-[var(--color-text-primary)]"></p>
      <div class="flex gap-3 justify-end mt-4">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="showDeleteConfirm.set(false)"
        >
          Cancel
        </button>
        <button type="button" class="btn btn-error" (click)="confirmDelete()">Delete</button>
      </div>
    </div>
  </app-modal>
</div>
