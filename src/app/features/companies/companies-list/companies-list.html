<div class="p-6">
  <!-- Header -->
  <div class="mb-6">
    <h1 class="text-2xl font-bold text-[var(--color-text-primary)]">Companies</h1>
    <p class="text-sm text-[var(--color-text-secondary)] mt-1">Manage your company records</p>
  </div>

  <!-- Toolbar with Search, Primary Action and Bulk Actions -->
  <div class="mb-4">
    <app-table-toolbar
      data-testid="companies-toolbar"
      searchPlaceholder="Search by name or ID..."
      [searchTestId]="'companies-search-input'"
      [primaryAction]="primaryAction"
      [bulkActions]="service.hasSelection() ? bulkActions : []"
      [showFilters]="false"
      (searchChange)="service.onSearch($event)"
      (bulkActionClick)="onBulkAction($event)"
    ></app-table-toolbar>
  </div>

  <!-- Table Card -->
  <div class="bg-white rounded-lg shadow-sm border border-[var(--color-border)]">
    <app-table
      data-testid="companies-table"
      [columns]="columns"
      [data]="service.getTableData()"
      [rowActions]="rowActions"
      [selectable]="true"
      [selectedItems]="service.selectedItems()"
      [rowIdKey]="'id'"
      [striped]="false"
      [hoverable]="true"
      [bordered]="false"
      [loading]="service.loading()"
      emptyMessage="No companies found"
      (selectionChange)="service.onSelectionChange($event)"
      (selectAll)="service.onSelectAll($event)"
    >
    </app-table>

    @if (service.filteredItems().length > 0) {
      <div class="border-t border-[var(--color-border)]">
        <app-table-pagination
          [currentPage]="service.currentPage()"
          [pageSize]="service.pageSize()"
          [totalItems]="service.filteredItems().length"
          (pageChange)="service.onPageChange($event)"
        />
      </div>
    }
  </div>

  <!-- Create/Edit Modal -->
  <app-modal
    [testId]="'company-form-modal'"
    [isOpen]="service.showModal()"
    [title]="service.editingItem() ? 'Edit Company' : 'New Company'"
    size="md"
    (closed)="service.onFormCancel()"
  >
    <app-company-form
      [company]="service.editingItem()"
      (companySaved)="service.onFormSave()"
      (formCancelled)="service.onFormCancel()"
    ></app-company-form>
  </app-modal>

  <!-- Delete Confirmation Modal -->
  <app-modal
    [testId]="'company-delete-modal'"
    [isOpen]="service.showDeleteConfirm()"
    title="Delete Company"
    size="sm"
    (closed)="service.cancelDelete()"
  >
    <div class="p-4">
      <p class="text-[var(--color-text-primary)] mb-4" [innerHTML]="service.deleteMessage()"></p>
      <div class="flex gap-3 justify-end">
        <button
          data-testid="delete-cancel-button"
          class="btn btn-secondary"
          (click)="service.cancelDelete()"
        >
          Cancel
        </button>
        <button
          data-testid="delete-confirm-button"
          class="btn btn-error"
          (click)="service.confirmDelete()"
        >
          Delete
        </button>
      </div>
    </div>
  </app-modal>
</div>
