<form [formGroup]="companyForm" (ngSubmit)="onSubmit()" class="p-6">
  <!-- Error Alert -->
  @if (error()) {
    <div class="alert alert-error mb-4">
      <svg
        class="alert-icon"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
        ></path>
      </svg>
      <span>{{ error() }}</span>
    </div>
  }

  <!-- Form Fields -->
  <div class="space-y-4">
    <!-- Company Name -->
    <div>
      <label class="form-label" for="companyName">
        Company Name
        <span class="text-[var(--color-error)]">*</span>
      </label>
      <app-base-input
        id="companyName"
        formControlName="name"
        placeholder="Enter company name"
        [class.form-input-error]="nameControl?.invalid && nameControl?.touched"
      ></app-base-input>
      @if (nameControl?.invalid && nameControl?.touched) {
        <div class="text-sm text-[var(--color-error)] mt-1">
          @if (nameControl?.errors?.['required']) {
            <span>Company name is required</span>
          }
          @if (nameControl?.errors?.['minlength']) {
            <span>Company name must be at least 2 characters</span>
          }
        </div>
      }
    </div>
  </div>

  <!-- Form Actions -->
  <div class="flex gap-3 justify-end mt-6 pt-4 border-t border-[var(--color-border)]">
    <button
      type="button"
      class="btn btn-secondary"
      (click)="onCancel()"
      [disabled]="loading()"
    >
      Cancel
    </button>
    <button
      type="submit"
      class="btn btn-primary"
      [disabled]="loading() || companyForm.invalid"
    >
      @if (loading()) {
        <svg
          class="animate-spin -ml-1 mr-2 h-4 w-4"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
        >
          <circle
            class="opacity-25"
            cx="12"
            cy="12"
            r="10"
            stroke="currentColor"
            stroke-width="4"
          ></circle>
          <path
            class="opacity-75"
            fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
          ></path>
        </svg>
        <span>Saving...</span>
      } @else {
        <span>{{ isEditMode ? 'Update' : 'Create' }}</span>
      }
    </button>
  </div>
</form>
